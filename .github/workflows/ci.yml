name: Conformance CI

# What this runner proves that a laptop cannot: that the kit's copy of the
# conformance specification is still the implementation's copy. Two jobs, both
# fail-closed, both runnable by hand --
#
#   python conformance/verify_vectors.py
#   python scripts/check_conformance_drift.py --helper <path to a helper checkout>
#
# Verified locally: the YAML parses and both commands are the ones in the steps
# below. NOT VERIFIED as a GitHub Actions run: the workflow itself has to
# execute on a runner.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vectors:
    name: Verify the conformance vectors (stdlib only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The verifier claims no dependency beyond the standard library, so it
        # is run against the versions the claim covers rather than one of them.
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify vectors and published receipts
        run: python conformance/verify_vectors.py
      - name: Verify with the key document named explicitly
        # The default path is the same file; naming it proves the option that a
        # reader outside this repo would use actually works.
        run: |
          python conformance/verify_vectors.py \
            --public-key conformance/verifier_public_key.json \
            --receipts conformance/benchmarks/receipts
      - name: Refuse a vector set that lost a case
        # The count gate is an if/sys.exit, not an assert, so it survives the
        # -O the runner may use. Delete one case and the verifier must fail.
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          path = pathlib.Path("conformance/vectors/canonical.json")
          doc = json.loads(path.read_text(encoding="utf-8"))
          doc["cases"] = doc["cases"][:-1]
          path.write_text(json.dumps(doc, indent=2) + "\n", encoding="utf-8")
          done = subprocess.run([sys.executable, "-O", "conformance/verify_vectors.py"])
          if done.returncode == 0:
              sys.exit("the 45-vector accounting gate did not fire under -O")
          print("44 vectors refused as required")
          PY

  drift:
    name: Kit copy must equal the implementation copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the implementation repository
        # A public repo works with the default token. If helper ever goes
        # private, replace this with a fine-grained PAT scoped to that repo;
        # the job fails loudly rather than skipping the comparison.
        uses: actions/checkout@v4
        with:
          repository: Raja549h/helper
          path: helper-checkout
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare conformance/ against the implementation
        run: python scripts/check_conformance_drift.py --helper helper-checkout
      - name: Record which implementation commit is mirrored
        run: |
          echo "This kit mirrors implementation commit $(cat SOURCE_COMMIT)."
          echo "Helper HEAD in this checkout: $(git -C helper-checkout rev-parse HEAD)."
